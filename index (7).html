<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>목소리 물고기 바다</title>
<style>
  :root{
    --sky1:#aee8ff; --sky2:#7fd4ff;
    --ink:#123a5c; --card:#ffffff;
    --accent:#ff6f91; --accent-dark:#e14e73;
    --btn:#ffd93d; --btn-dark:#f0b429;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;font-family:'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  body{background:#0b3b63}
  #sea{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}

  /* ---------- 상단 바 ---------- */
  #topbar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px;pointer-events:none;z-index:5}
  .chip{pointer-events:auto;background:rgba(255,255,255,.92);color:var(--ink);border:none;border-radius:999px;
    padding:10px 16px;font-size:16px;font-weight:700;box-shadow:0 3px 10px rgba(10,40,80,.25);display:flex;align-items:center;gap:8px;min-height:44px}
  button.chip{cursor:pointer}
  button.chip:focus-visible{outline:3px solid #ff6f91;outline-offset:2px}
  #clearBtn.armed{background:#ffe3e9;color:#c2184a}

  /* ---------- 하단 컨트롤 ---------- */
  #bottombar{position:fixed;bottom:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 16px calc(18px + env(safe-area-inset-bottom));z-index:5}
  #hint{background:rgba(9,44,80,.75);color:#fff;font-size:17px;font-weight:600;padding:10px 20px;border-radius:999px;text-align:center;max-width:92vw;line-height:1.4}
  #recBtn{position:relative;width:92px;height:92px;border-radius:50%;border:none;cursor:pointer;
    background:radial-gradient(circle at 32% 28%, #ffe98a, var(--btn) 55%, var(--btn-dark));
    box-shadow:0 6px 0 #c98f12, 0 10px 24px rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;transition:transform .12s}
  #recBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #c98f12,0 6px 14px rgba(0,0,0,.3)}
  #recBtn:focus-visible{outline:4px solid #fff;outline-offset:3px}
  #recBtn.recording{background:radial-gradient(circle at 32% 28%, #ff9eb3, var(--accent) 55%, var(--accent-dark));box-shadow:0 6px 0 #b02d55,0 10px 24px rgba(0,0,0,.35)}
  #recBtn svg{width:44px;height:44px;fill:#7a5600;transition:fill .2s}
  #recBtn.recording svg{fill:#fff}
  #ring{position:absolute;inset:-7px;pointer-events:none}
  #ring circle{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;
    transform:rotate(-90deg);transform-origin:center;opacity:0}
  #recBtn.recording #ring circle{opacity:.95}

  /* ---------- 토스트 ---------- */
  #toast{position:fixed;left:50%;top:18%;transform:translate(-50%,-10px);background:#fff;color:var(--ink);
    padding:14px 22px;border-radius:20px;font-size:18px;font-weight:800;box-shadow:0 8px 24px rgba(10,40,80,.35);
    opacity:0;pointer-events:none;transition:opacity .3s, transform .3s;z-index:8;text-align:center;max-width:88vw;line-height:1.45}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- 시작 화면 ---------- */
  #intro{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,var(--sky1),#2e86c9 60%,#0b3b63);padding:20px}
  .introCard{background:rgba(255,255,255,.96);border-radius:28px;padding:34px 28px;max-width:440px;width:100%;
    text-align:center;box-shadow:0 20px 50px rgba(0,30,60,.4)}
  .introCard h1{color:var(--ink);font-size:30px;margin-bottom:14px;letter-spacing:-.5px}
  .introCard p{color:#2a5a84;font-size:17px;line-height:1.65;margin-bottom:8px}
  .introCard .steps{display:flex;flex-direction:column;gap:10px;margin:18px 0 22px;text-align:left}
  .step{display:flex;gap:12px;align-items:center;background:#eef7ff;border-radius:16px;padding:12px 14px}
  .step .num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;
    display:flex;align-items:center;justify-content:center;font-size:17px}
  .step span{color:var(--ink);font-size:16px;font-weight:600;line-height:1.4}
  #startBtn{width:100%;min-height:58px;border:none;border-radius:999px;background:linear-gradient(180deg,#ff8fa9,var(--accent));
    color:#fff;font-size:21px;font-weight:800;cursor:pointer;box-shadow:0 5px 0 var(--accent-dark);transition:transform .12s}
  #startBtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-dark)}
  #startBtn:focus-visible{outline:4px solid var(--ink);outline-offset:2px}
  #micErr{color:#c2184a;font-size:15px;font-weight:700;margin-top:12px;display:none;line-height:1.5}

  /* ---------- 마이크 허락 팝업 ---------- */
  #micModal,#nameModal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
    background:rgba(6,30,56,.62);padding:20px}
  #micModal.open,#nameModal.open{display:flex}
  .mCard{background:#fff;border-radius:28px;max-width:400px;width:100%;padding:30px 26px 24px;text-align:center;
    box-shadow:0 24px 60px rgba(0,20,50,.5);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  .mIcon{width:96px;height:96px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 32% 28%,#ffe98a,var(--btn) 55%,var(--btn-dark));box-shadow:0 5px 0 #c98f12;position:relative}
  .mIcon svg{width:48px;height:48px;fill:#7a5600}
  .mIcon.wait::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--btn);animation:pulse 1.2s infinite}
  .mIcon.bad{background:radial-gradient(circle at 32% 28%,#ffc2cf,#ff8fa9 55%,var(--accent-dark));box-shadow:0 5px 0 #b02d55}
  .mIcon.bad svg{fill:#fff}
  @keyframes pulse{from{transform:scale(.9);opacity:1}to{transform:scale(1.25);opacity:0}}
  .mCard h2{color:var(--ink);font-size:24px;margin-bottom:10px;line-height:1.3}
  .mCard .mText{color:#2a5a84;font-size:17px;line-height:1.6;margin-bottom:16px}
  .mGuide{text-align:left;background:#eef7ff;border-radius:16px;padding:14px 16px;margin-bottom:16px;display:none}
  .mGuide.show{display:block}
  .mGuide ol{padding-left:22px;color:var(--ink);font-size:15.5px;line-height:1.7;font-weight:600}
  .mGuide .who{font-size:13.5px;color:#4a7398;font-weight:700;margin-bottom:6px}
  .mBtns{display:flex;flex-direction:column;gap:10px}
  .mBtn{min-height:56px;border:none;border-radius:999px;font-size:20px;font-weight:800;cursor:pointer;transition:transform .12s}
  .mBtn.main{background:linear-gradient(180deg,#ff8fa9,var(--accent));color:#fff;box-shadow:0 5px 0 var(--accent-dark)}
  .mBtn.main:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-dark)}
  .mBtn.sub{background:#eef2f6;color:#456;font-size:16px;min-height:48px}
  .mBtn:focus-visible{outline:4px solid var(--ink);outline-offset:2px}
  .mBtn[hidden]{display:none}
  /* 브라우저 팝업 위치 안내 화살표 */
  #arrowHint{position:fixed;top:8px;left:16px;z-index:21;display:none;align-items:center;gap:8px;
    background:#fff;color:var(--ink);font-weight:800;font-size:16px;padding:10px 16px;border-radius:16px;
    box-shadow:0 6px 18px rgba(0,0,0,.3);animation:bob 1s ease-in-out infinite alternate}
  #arrowHint.show{display:flex}
  #arrowHint svg{width:26px;height:26px}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-8px)}}

  /* ---------- 이름 짓기 ---------- */
  #nPrev{display:block;width:100%;height:120px;margin:4px 0 6px;border-radius:18px;background:linear-gradient(180deg,#2e9fd9,#1670b0)}
  #nInput{width:100%;min-height:54px;border:3px solid #cfe6fb;border-radius:16px;font-size:21px;font-weight:800;
    text-align:center;color:var(--ink);margin-bottom:10px;font-family:inherit;outline:none}
  #nInput:focus{border-color:var(--accent)}
  #nChips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px}
  .chipBtn{min-height:44px;padding:0 16px;border:2px solid #cfe6fb;background:#eef7ff;color:var(--ink);border-radius:999px;
    font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
  .chipBtn:hover{background:#dcefff}
  .chipBtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  /* ---------- 다이버 뽀글이 ---------- */
  #diver{position:fixed;left:10px;bottom:170px;z-index:6}
  #diverBtn{width:88px;height:96px;border:none;background:none;cursor:pointer;padding:0;display:block;animation:dive 3s ease-in-out infinite alternate}
  #diverBtn:focus-visible{outline:3px solid #fff;outline-offset:2px;border-radius:20px}
  #diverBtn svg{width:100%;height:100%;overflow:visible}
  #diverArm{transform-origin:68px 64px;animation:wave 1.2s ease-in-out infinite alternate}
  .dBub{animation:rise 2.4s linear infinite;opacity:0}
  .dBub:nth-child(2){animation-delay:.8s}.dBub:nth-child(3){animation-delay:1.6s}
  @keyframes dive{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-12px) rotate(3deg)}}
  @keyframes wave{from{transform:rotate(-10deg)}to{transform:rotate(25deg)}}
  @keyframes rise{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-40px);opacity:0}}
  #dTag{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:#fff;color:var(--ink);font-size:13px;font-weight:800;
    padding:2px 10px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.25);pointer-events:none}
  #bubble{position:absolute;left:0;bottom:calc(100% + 12px);width:min(330px,calc(100vw - 24px));background:#fff;border-radius:22px;
    padding:16px 16px 10px;box-shadow:0 10px 28px rgba(5,30,60,.4);display:none}
  #bubble.show{display:block;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
  #bubble::after{content:'';position:absolute;left:34px;bottom:-12px;border:12px solid transparent;border-top-color:#fff;border-bottom:0}
  #bWho{font-size:13px;font-weight:800;color:var(--accent-dark);margin-bottom:4px}
  #bText{color:var(--ink);font-size:17px;line-height:1.6;font-weight:600;padding-right:22px}
  #bText b{color:#1c6dd0}
  #bTry{margin-top:10px;display:none;width:100%;min-height:46px;border:none;border-radius:999px;background:var(--btn);color:#5a4000;
    font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--btn-dark);font-family:inherit}
  #bTry.show{display:block}
  .bNav{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
  .bNav button{width:44px;height:44px;border:none;border-radius:50%;background:#eef7ff;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .bNav button:focus-visible,#bClose:focus-visible,#bTry:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .bNav svg{width:22px;height:22px}
  #bPage{font-size:14px;font-weight:700;color:#4a7398}
  #bClose{position:absolute;top:6px;right:6px;width:44px;height:44px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
  @media (max-width:600px){
    #diver{bottom:210px;left:6px}
    #diverBtn{width:70px;height:78px}
    #bText{font-size:16px}
  }

  @media (prefers-reduced-motion: reduce){
    #toast{transition:none}
    #diverBtn,#diverArm,.dBub,#bubble.show{animation:none}
    .mCard,#arrowHint,.mIcon.wait::after{animation:none}
  }
</style>
</head>
<body>

<canvas id="sea" aria-label="목소리 물고기들이 헤엄치는 바다"></canvas>

<div id="topbar">
  <div class="chip" id="counter" role="status">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1c6dd0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 12c3.5-5 9.5-5 13 0-3.5 5-9.5 5-13 0z"/><circle cx="16" cy="11.2" r="0.6" fill="#1c6dd0"/><path d="M6.5 12L3 9v6z"/></svg>
    <span id="countText">물고기 0마리</span>
  </div>
  <button class="chip" id="clearBtn" aria-label="바다 비우기">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c2184a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
    <span id="clearText">비우기</span>
  </button>
</div>

<div id="bottombar">
  <div id="hint">노란 버튼을 누르고 소리를 내 보세요!</div>
  <button id="recBtn" aria-label="목소리 녹음하기">
    <svg id="micIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15zm6-3.5a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.93V22h2v-2.57A8 8 0 0 0 20 11.5h-2z"/></svg>
    <svg id="stopIcon" viewBox="0 0 24 24" style="display:none" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
    <svg id="ring" viewBox="0 0 106 106"><circle cx="53" cy="53" r="49"/></svg>
  </button>
</div>

<div id="toast" role="status"></div>

<!-- 다이버 뽀글이 -->
<div id="diver" style="display:none">
  <div id="bubble" role="status" aria-live="polite">
    <button id="bClose" aria-label="말풍선 닫기">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7a93ab" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div id="bWho">다이버 뽀글이</div>
    <div id="bText"></div>
    <button id="bTry"></button>
    <div class="bNav">
      <button id="bPrev" aria-label="이전 이야기"><svg viewBox="0 0 24 24" fill="none" stroke="#1c6dd0" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span id="bPage"></span>
      <button id="bNext" aria-label="다음 이야기"><svg viewBox="0 0 24 24" fill="none" stroke="#1c6dd0" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </div>
  <button id="diverBtn" aria-label="다이버 뽀글이에게 목소리 물고기 비밀 듣기">
    <svg viewBox="0 0 100 110" aria-hidden="true">
      <g><circle class="dBub" cx="66" cy="10" r="4" fill="none" stroke="#fff" stroke-width="2"/><circle class="dBub" cx="72" cy="14" r="3" fill="none" stroke="#fff" stroke-width="2"/><circle class="dBub" cx="62" cy="16" r="2.5" fill="none" stroke="#fff" stroke-width="2"/></g>
      <!-- 오리발 -->
      <ellipse cx="38" cy="104" rx="13" ry="5" fill="#ff8a3d"/><ellipse cx="62" cy="104" rx="13" ry="5" fill="#ff8a3d"/>
      <rect x="35" y="86" width="9" height="16" rx="4" fill="#f0b429"/><rect x="56" y="86" width="9" height="16" rx="4" fill="#f0b429"/>
      <!-- 산소통 -->
      <rect x="20" y="52" width="13" height="34" rx="6" fill="#8fb4d6" stroke="#5f88ad" stroke-width="2"/>
      <!-- 몸 -->
      <rect x="29" y="54" width="42" height="38" rx="17" fill="#ffd93d" stroke="#e0a91f" stroke-width="2"/>
      <rect x="29" y="70" width="42" height="6" fill="#ff6f91"/>
      <!-- 흔드는 팔 -->
      <g id="diverArm"><path d="M68 64 L84 50" stroke="#ffd93d" stroke-width="9" stroke-linecap="round"/><circle cx="85" cy="49" r="6" fill="#ffd9b8"/></g>
      <path d="M32 64 L22 78" stroke="#ffd93d" stroke-width="9" stroke-linecap="round"/>
      <!-- 헬멧 -->
      <circle cx="50" cy="34" r="27" fill="#d8f3ff" stroke="#8fc3e6" stroke-width="4"/>
      <circle cx="50" cy="36" r="17" fill="#ffd9b8"/>
      <path d="M33 30 Q50 14 67 30" fill="#5b3a29"/>
      <circle cx="44" cy="36" r="2.6" fill="#223"/><circle cx="56" cy="36" r="2.6" fill="#223"/>
      <circle cx="40" cy="42" r="3" fill="#ffb3c1" opacity=".8"/><circle cx="60" cy="42" r="3" fill="#ffb3c1" opacity=".8"/>
      <path d="M45 44 Q50 49 55 44" fill="none" stroke="#c0405f" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M30 22 Q36 13 46 11" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".85"/>
    </svg>
    <span id="dTag">뽀글이</span>
  </button>
</div>

<!-- 이름 짓기 -->
<div id="nameModal" role="dialog" aria-modal="true" aria-labelledby="nTitle">
  <div class="mCard">
    <h2 id="nTitle">새 물고기가 태어났어요!</h2>
    <canvas id="nPrev" aria-label="이름을 지을 물고기 모습"></canvas>
    <p class="mText" id="nText" style="margin-bottom:10px">내 목소리로 태어난 물고기에게<br><b>이름</b>을 지어 주세요</p>
    <label for="nInput" style="position:absolute;left:-9999px">물고기 이름</label>
    <input id="nInput" maxlength="8" autocomplete="off" placeholder="이름 쓰기 (8글자까지)">
    <div id="nChips"></div>
    <div class="mBtns">
      <button class="mBtn main" id="nOk">이름 짓기</button>
      <button class="mBtn sub" id="nSkip">추천 이름으로 할래요</button>
    </div>
  </div>
</div>

<div id="arrowHint" aria-hidden="true">
  <svg viewBox="0 0 24 24" fill="none" stroke="#ff6f91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V4M5 11l7-7 7 7"/></svg>
  위에 뜬 창에서 <b style="color:#e14e73">'허용'</b>을 눌러요!
</div>

<div id="micModal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="mCard">
    <div class="mIcon" id="mIcon">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15zm6-3.5a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.93V22h2v-2.57A8 8 0 0 0 20 11.5h-2z"/></svg>
    </div>
    <h2 id="mTitle">마이크를 써도 될까요?</h2>
    <p class="mText" id="mText">물고기를 만들려면 <b>목소리</b>가 필요해요.<br>아래 버튼을 누르면 허락을 묻는 창이 떠요.</p>
    <div class="mGuide" id="mGuide"></div>
    <div class="mBtns">
      <button class="mBtn main" id="mAllow">마이크 허락하기</button>
      <button class="mBtn sub" id="mClose">나중에 할게요</button>
    </div>
  </div>
</div>

<div id="intro">
  <div class="introCard">
    <h1>🌊 목소리 물고기 바다</h1>
    <p><b>목소리에는 모양이 있대요!</b><br>내 목소리는 어떤 모양일까요?</p>
    <div class="steps">
      <div class="step"><div class="num">1</div><span>버튼을 누르고 소리를 내요 — "아~", 노래, 웃음소리 다 좋아요!</span></div>
      <div class="step"><div class="num">2</div><span>목소리가 바다의 <b>물결</b>이 되어 출렁여요</span></div>
      <div class="step"><div class="num">3</div><span>물결이 <b>물고기</b>로 변해 바다를 헤엄쳐요!</span></div>
    </div>
    <button id="startBtn">마이크 켜고 시작하기</button>
    <p id="micErr"></p>
  </div>
</div>

<script>
'use strict';
/* ============== 기본 설정 ============== */
const canvas = document.getElementById('sea');
let ctx = canvas.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MAX_REC = 4;           // 최대 녹음 초
const MAX_FISH = 24;

let W = 0, H = 0, DPR = 1;
let surfaceY = 0, sandY = 0;

function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  surfaceY = H * 0.20;
  sandY = H * 0.88;
}
addEventListener('resize', () => { resize(); for (const f of fishes) f.L = fishLength(f); }); resize();

/* ============== 오디오 ============== */
let audioCtx = null, analyser = null, timeData = null, freqData = null, micReady = false;

async function initMic(){
  if (micReady) return;
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:true }
  });
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const src = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.5;
  src.connect(analyser);
  timeData = new Float32Array(analyser.fftSize);
  freqData = new Uint8Array(analyser.frequencyBinCount);
  micReady = true;
}

/* ============== 상태 ============== */
let state = 'idle';          // idle | recording | morphing
let recStart = 0;
let envRec = [];             // 프레임별 크기(진폭) → 물고기 몸 높이
let ripRec = [];             // 프레임별 떨림(-1~1) → 몸 가장자리 물결, 높은 소리일수록 촘촘
let ripPhase = 0, lastPeak = 0, zcSum = 0, zcN = 0;
let centroidSum = 0, centroidW = 0, rmsSum = 0, rmsN = 0;
let liveWave = new Float32Array(0);

const fishes = [];
let morph = null;
let armClear = false, armTimer = 0;

/* ============== 파동 모양 계산 (리본과 물고기가 똑같이 사용) ============== */
const RIBBON_AMP = 42;       // 리본 최대 반높이(px)
const RIP_K = 0.17;          // 가장자리 물결 깊이
function ribbonWidth(){ return Math.min(W*0.62, 520); }
function shapeH(env, pk){ return Math.pow(Math.max(0, env)/pk, 0.8); }   // 0~1

/* ============== 저장 ============== */
const r2 = v => Math.round(v*100)/100;
function save(){
  try{
    const data = fishes.map(f => ({ e: f.env.map(r2), r: f.rip.map(r2), d: r2(f.dur), h: f.hue, s: Math.round(f.size), n: f.name }));
    localStorage.setItem('voiceFishV2', JSON.stringify(data));
  }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem('voiceFishV2');
    if(!raw) return;
    JSON.parse(raw).slice(0, MAX_FISH).forEach(d => {
      const f = makeFish(d.e, d.r, d.d, d.h, d.s, d.n);
      f.x = Math.random()*W; f.baseY = f.y = waterBandY();
      fishes.push(f);
    });
  }catch(e){}
  updateCount();
}

/* ============== 물고기 ============== */
function waterBandY(){
  const top = surfaceY + H*0.14, bot = sandY - H*0.10;
  return top + Math.random()*(bot-top);
}

const NAME_TABLE = [
  ['둥실이','우렁이'],   // 낮은음 [조용, 큰소리]
  ['반짝이','쨍쨍이']    // 높은음
];
function makeName(pitchNorm, loudNorm){
  const base = NAME_TABLE[pitchNorm > .45 ? 1 : 0][loudNorm > .5 ? 1 : 0];
  return base + '-' + (Math.floor(Math.random()*90)+10);
}

/* env: 0~1 몸 높이 배열(녹음 순서 그대로), rip: -1~1 떨림, dur: 소리 길이(초) */
function makeFish(env, rip, dur, hue, size, name){
  const f = {
    env, rip, dur, hue, size, name,
    x: W/2, y: H*0.5, L: 0,
    dir: Math.random() < .5 ? 1 : -1,
    speed: 18 + Math.random()*26,
    bobA: 6 + Math.random()*8,
    bobF: .6 + Math.random()*.6,
    phase: Math.random()*Math.PI*2,
    baseY: 0,
    state: 'swim'
  };
  f.L = fishLength(f);
  return f;
}
// 소리가 길수록 물고기도 길어요
function fishLength(f){ return f.size*0.8 + Math.min(1, f.dur/MAX_REC) * Math.min(W*0.34, 280); }

/* 녹음 데이터 → 물고기 생성 */
function finishRecording(){
  const avgRms = rmsN ? rmsSum/rmsN : 0;
  const el = Math.min(MAX_REC, (performance.now() - recStart)/1000);
  setRecUI(false);
  state = 'idle';
  const n = envRec.length;
  let pk = 0.05; for (const v of envRec) pk = Math.max(pk, v);
  // 앞뒤 조용한 부분만 잘라내고, 가운데는 녹음된 그대로
  let a = 0, b = n-1;
  while (a < n && envRec[a] < pk*0.15) a++;
  while (b > a && envRec[b] < pk*0.15) b--;
  if (n < 8 || avgRms < 0.01 || b - a < 4){
    toast('소리가 너무 작았어요 🤫<br>조금만 더 크게 소리 내 볼까요?');
    hint('버튼을 누르고 "아~" 하고 소리 내 보세요!');
    return;
  }
  const env = envRec.slice(a, b+1).map(v => shapeH(v, pk));
  const rip = ripRec.slice(a, b+1);
  const dur = el * (b - a + 1) / n;

  // 소리 높낮이: 파형이 0을 지나는 횟수로 판단 (낮은 소리 ≈ 10, 높은 소리 ≈ 50)
  const zcAvg = zcN ? zcSum/zcN : 20;
  const pitchNorm = Math.min(1, Math.max(0, (zcAvg - 12) / 34));
  const loudNorm  = Math.min(1, avgRms / 0.18);
  const hue  = Math.round(235 - pitchNorm * 205);            // 낮은음=파랑 → 높은음=주황
  const size = 56 + loudNorm * 50;
  const fish = makeFish(env, rip, dur, hue, size, '');
  fish.state = 'forming';
  fish.dir = 1;
  fishes.push(fish);
  if (fishes.length > MAX_FISH) fishes.shift();

  // 변신 시작점 = 녹음 화면에 그려졌던 리본의 정확한 위치
  const ribW = ribbonWidth();
  const curW = ribW * Math.min(1, el/MAX_REC);
  const left = W/2 - ribW/2;
  morph = {
    fish, t0: performance.now(),
    x0: left + (n>1 ? a/(n-1) : 0)*curW,
    x1: left + (n>1 ? b/(n-1) : 1)*curW,
    cy: surfaceY + 70
  };
  state = 'morphing';
  hint('내 목소리 파동이 물고기로 변하고 있어요...!');
}

/* ============== 녹음 제어 ============== */
const recBtn = document.getElementById('recBtn');
const micIcon = document.getElementById('micIcon');
const stopIcon = document.getElementById('stopIcon');
const ringC = document.querySelector('#ring circle');
const RING_LEN = 2*Math.PI*49;
ringC.style.strokeDasharray = RING_LEN;

function setRecUI(on){
  recBtn.classList.toggle('recording', on);
  micIcon.style.display = on ? 'none' : 'block';
  stopIcon.style.display = on ? 'block' : 'none';
  recBtn.setAttribute('aria-label', on ? '녹음 멈추기' : '목소리 녹음하기');
}

recBtn.addEventListener('click', () => {
  if (!micReady) return;
  if (state === 'recording'){ finishRecording(); return; }
  if (state !== 'idle') return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  envRec = []; ripRec = []; ripPhase = 0; lastPeak = 0; zcSum = 0; zcN = 0; centroidSum = 0; centroidW = 0; rmsSum = 0; rmsN = 0;
  recStart = performance.now();
  state = 'recording';
  toastEl.classList.remove('show');
  bubble.classList.remove('show');
  setRecUI(true);
  hint(challenge ? '도전 중! ' + challenge : '좋아요! 소리를 내 보세요 — "아~" 길게, 또는 노래도 좋아요!');
});

/* ============== UI 유틸 ============== */
const toastEl = document.getElementById('toast');
let toastTimer = 0;
function toast(html, ms=2800){
  toastEl.innerHTML = html;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'), ms);
}
const hintEl = document.getElementById('hint');
function hint(t){ hintEl.textContent = t; }
const countText = document.getElementById('countText');
function updateCount(){ countText.textContent = '물고기 ' + fishes.length + '마리'; }

/* 비우기: 두 번 눌러 확인 */
const clearBtn = document.getElementById('clearBtn');
const clearText = document.getElementById('clearText');
clearBtn.addEventListener('click', () => {
  if (!armClear){
    armClear = true;
    clearBtn.classList.add('armed');
    clearText.textContent = '정말 비울까요?';
    clearTimeout(armTimer);
    armTimer = setTimeout(resetClear, 2500);
  } else {
    fishes.length = 0; morph = null;
    if (state === 'morphing') state = 'idle';
    save(); updateCount(); resetClear();
    toast('바다가 깨끗해졌어요! 새 물고기를 만들어 봐요 🐟');
  }
});
function resetClear(){
  armClear = false;
  clearBtn.classList.remove('armed');
  clearText.textContent = '비우기';
}

/* 물고기 터치 → 이름 보여주기 */
canvas.addEventListener('pointerdown', e => {
  const x = e.clientX, y = e.clientY;
  let best = null, bd = 1e9;
  for (const f of fishes){
    if (f.state !== 'swim') continue;
    const d = Math.hypot(f.x-x, f.y-y);
    if (Math.abs(f.x-x) < f.L/2 + 10 && Math.abs(f.y-y) < f.size*0.55 + 10 && d < bd){ bd = d; best = f; }
  }
  if (best && state === 'idle') openNaming(best, 'rename');
});

/* ============== 그리기 ============== */
/* 물고기 몸 윤곽: 리본과 같은 규칙. 왼쪽=녹음 시작(꼬리), 오른쪽=녹음 끝(머리) */
function fishBody(f, time, wig){
  const n = f.env.length, L = f.L, half = f.size*0.5;
  const minH = f.size*0.07;
  const top = [], bot = [], mid = [];
  for (let i=0;i<n;i++){
    const t = n>1 ? i/(n-1) : 0;
    const x = -L/2 + t*L;
    // 양 끝만 살짝 오므려 닫음 (모양은 건드리지 않음)
    const cap = Math.min(1, (i+1)/3, (n-i)/3);
    const h = Math.max(minH, f.env[i]*half) * (1 + RIP_K*f.rip[i]) * (0.55 + 0.45*cap);
    const w = wig ? Math.sin(time*0.006 - t*5 + f.phase) * 3 * (1-t) : 0;
    top.push([x, -h + w]); bot.push([x, h + w]); mid.push([x, w, h]);
  }
  return {top, bot, mid, L};
}

function tracePoly(top, bot){
  ctx.beginPath();
  ctx.moveTo(top[0][0], top[0][1]);
  for (let i=1;i<top.length;i++) ctx.lineTo(top[i][0], top[i][1]);
  for (let i=bot.length-1;i>=0;i--) ctx.lineTo(bot[i][0], bot[i][1]);
  ctx.closePath();
}

function drawParts(f, o, alpha){
  const n = o.top.length;
  // 꼬리 (녹음 시작 쪽)
  const t0 = o.mid[0], th = Math.max(f.size*0.22, t0[2]*1.1);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'hsl(' + f.hue + ', 75%, 50%)';
  ctx.beginPath();
  ctx.moveTo(t0[0]+3, t0[1]);
  ctx.lineTo(t0[0]-f.size*0.38, t0[1]-th);
  ctx.quadraticCurveTo(t0[0]-f.size*0.18, t0[1], t0[0]-f.size*0.38, t0[1]+th);
  ctx.closePath(); ctx.fill();

  // 눈·입 (녹음 끝 쪽 = 머리)
  const hi = Math.max(0, n-1 - Math.round(n*0.08));
  const hm = o.mid[hi];
  const er = Math.max(3.5, Math.min(f.size*0.11, hm[2]*0.5));
  const ex = hm[0], ey = hm[1] - hm[2]*0.25;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, ey, er, 0, 7); ctx.fill();
  ctx.fillStyle = '#143'; ctx.beginPath(); ctx.arc(ex+er*0.25, ey, er*0.55, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex+er*0.45, ey-er*0.3, er*0.2, 0, 7); ctx.fill();
  const tip = o.mid[n-1];
  ctx.strokeStyle = 'rgba(20,40,60,.55)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(tip[0]-er*0.6, tip[1]+Math.max(2, tip[2]*0.35), er*0.55, 0.3, Math.PI-0.5); ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawFishShape(f, time){
  const o = fishBody(f, time, !reduceMotion);
  ctx.save();
  ctx.translate(f.x, f.y);
  if (f.dir < 0) ctx.scale(-1,1);

  // 몸통 = 목소리 파동 리본 그대로
  const g = ctx.createLinearGradient(0,-f.size*0.5,0,f.size*0.5);
  g.addColorStop(0,'hsl(' + f.hue + ', 85%, 66%)');
  g.addColorStop(1,'hsl(' + f.hue + ', 80%, 46%)');
  ctx.fillStyle = g;
  tracePoly(o.top, o.bot); ctx.fill();
  ctx.strokeStyle = 'hsla(' + f.hue + ', 70%, 32%, .55)'; ctx.lineWidth = 1.5; ctx.stroke();

  // 몸 속 파동선: 떨림 그대로
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.8;
  ctx.beginPath();
  o.mid.forEach((m,i) => { const y = m[1] + f.rip[i]*m[2]*0.45; i ? ctx.lineTo(m[0], y) : ctx.moveTo(m[0], y); });
  ctx.stroke();

  drawParts(f, o, 1);
  ctx.restore();
}

/* 변신: 녹음 리본(제자리) → 같은 모양의 물고기 */
const MORPH_MS = 1700;
function drawMorph(time){
  const f = morph.fish;
  const p = Math.min(1, (time - morph.t0) / (reduceMotion ? 400 : MORPH_MS));
  const e = p<.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2;
  const n = f.env.length;

  const endX = (morph.x0 + morph.x1)/2;
  const endY = f.baseY || (f.baseY = waterBandY());
  const o = fishBody(f, time, false);
  const top = [], bot = [], mid = [];
  for (let i=0;i<n;i++){
    const t = n>1 ? i/(n-1) : 0;
    const sx = morph.x0 + t*(morph.x1 - morph.x0);
    const sh = f.env[i]*RIBBON_AMP*(1 + RIP_K*f.rip[i]) + 4;
    const fx = endX + o.top[i][0];
    const x = sx + (fx - sx)*e;
    const yT = (morph.cy - sh) + ((endY + o.top[i][1]) - (morph.cy - sh))*e;
    const yB = (morph.cy + sh) + ((endY + o.bot[i][1]) - (morph.cy + sh))*e;
    top.push([x, yT]); bot.push([x, yB]); mid.push([x, (yT+yB)/2, (yB-yT)/2]);
  }
  ctx.save();
  // 흰 리본 → 물고기 색으로
  tracePoly(top, bot);
  ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.globalAlpha = 1 - e; ctx.fill();
  ctx.fillStyle = 'hsl(' + f.hue + ', 82%, 58%)'; ctx.globalAlpha = e; ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(255,111,145,' + (1-e) + ')'; ctx.lineWidth = 2.5; ctx.stroke();
  if (e > 0.55){
    ctx.save(); ctx.translate(0,0);
    drawParts(f, {top, bot, mid}, (e-0.55)/0.45);
    ctx.restore();
  }
  ctx.restore();

  if (p >= 1){
    f.x = endX; f.y = f.baseY = endY;
    f.state = 'swim';
    morph = null;
    save(); updateCount();
    openNaming(f, 'new');
  }
}

/* 녹음 중: 목소리 파동이 왼쪽부터 그려지는 리본 */
function drawGrowingRibbon(time){
  const n = envRec.length;
  if (n < 2) return;
  const ribW = ribbonWidth();
  const curW = ribW * Math.min(1, (time - recStart)/1000/MAX_REC);
  let pk = 0.05; for (const v of envRec) pk = Math.max(pk, v);
  const left = W/2 - ribW/2, cy = surfaceY + 70;
  const top = [], bot = [];
  for (let i=0;i<n;i++){
    const x = left + (i/(n-1))*curW;
    const h = shapeH(envRec[i], pk)*RIBBON_AMP*(1 + RIP_K*ripRec[i]) + 4;
    top.push([x, cy - h]); bot.push([x, cy + h]);
  }
  ctx.save();
  tracePoly(top, bot);
  ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.fill();
  ctx.strokeStyle = '#ff6f91'; ctx.lineWidth = 2.5; ctx.stroke();
  const tip = top[n-1];
  ctx.fillStyle = '#ffd93d';
  ctx.beginPath(); ctx.arc(tip[0], cy, 7 + Math.sin(time*0.02)*2, 0, 7); ctx.fill();
  ctx.font = '700 16px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.fillText('내 목소리 파동이 그려지고 있어요! 이 모양 그대로 물고기가 돼요', W/2, cy + RIBBON_AMP + 34);
  ctx.restore();
}

/* ============== 배경 요소 ============== */
const bubbles = Array.from({length:18}, () => ({
  x: Math.random(), y: Math.random(), r: 2+Math.random()*5, s: .25+Math.random()*.6
}));
const weeds = Array.from({length:7}, (_,i) => ({
  x: (i+0.5)/7 + (Math.random()-.5)*0.06, h: 50+Math.random()*70, ph: Math.random()*6, hue: 140+Math.random()*40
}));

function drawScene(time){
  // 하늘
  const sky = ctx.createLinearGradient(0,0,0,surfaceY);
  sky.addColorStop(0,'#bfeaff'); sky.addColorStop(1,'#8fd8ff');
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,surfaceY+20);
  // 해
  ctx.fillStyle = '#ffe36e';
  ctx.beginPath(); ctx.arc(W*0.85, surfaceY*0.42, 26, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,227,110,.35)';
  ctx.beginPath(); ctx.arc(W*0.85, surfaceY*0.42, 40, 0, 7); ctx.fill();
  // 구름
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  cloud(W*0.2 + Math.sin(time*0.00008)*20, surfaceY*0.4, 1);
  cloud(W*0.55, surfaceY*0.6, 0.7);

  // 바다
  const seaG = ctx.createLinearGradient(0,surfaceY,0,H);
  seaG.addColorStop(0,'#2e9fd9'); seaG.addColorStop(.5,'#1670b0'); seaG.addColorStop(1,'#0b3b63');
  ctx.fillStyle = seaG; ctx.fillRect(0,surfaceY,W,H-surfaceY);

  // 빛줄기
  ctx.save(); ctx.globalAlpha = 0.08; ctx.fillStyle = '#fff';
  for (let i=0;i<3;i++){
    const bx = W*(0.25+0.25*i) + Math.sin(time*0.0003+i)*18;
    ctx.beginPath();
    ctx.moveTo(bx-14, surfaceY); ctx.lineTo(bx+14, surfaceY);
    ctx.lineTo(bx+70, H); ctx.lineTo(bx-40, H);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // 수면 물결 (녹음 중에는 목소리 파형이 물결이 됨!)
  drawSurface(time);

  // 모래
  ctx.fillStyle = '#e8c97e';
  ctx.beginPath();
  ctx.moveTo(0,H); ctx.lineTo(0,sandY+12);
  for (let x=0;x<=W;x+=40) ctx.quadraticCurveTo(x+20, sandY + (x/40%2?0:16), x+40, sandY+10);
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();

  // 해초
  const sway = reduceMotion ? 0 : 1;
  for (const w of weeds){
    const bx = w.x*W;
    ctx.strokeStyle = 'hsl(' + w.hue + ', 55%, 38%)';
    ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(bx, sandY+14);
    for (let s=1;s<=4;s++){
      const t = s/4;
      ctx.lineTo(bx + Math.sin(time*0.0012 + w.ph + t*2)*10*t*sway, sandY+14 - w.h*t);
    }
    ctx.stroke();
  }

  // 물방울
  if (!reduceMotion){
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    for (const b of bubbles){
      b.y -= b.s*0.0012;
      if (b.y < 0.22){ b.y = 0.92; b.x = Math.random(); }
      ctx.beginPath(); ctx.arc(b.x*W, b.y*H, b.r, 0, 7); ctx.fill();
    }
  }
}

function cloud(x,y,s){
  ctx.beginPath();
  ctx.arc(x,y,18*s,0,7); ctx.arc(x+20*s,y-8*s,14*s,0,7); ctx.arc(x+38*s,y,16*s,0,7);
  ctx.fill();
}

function drawSurface(time){
  const recording = state === 'recording';
  ctx.save();
  ctx.strokeStyle = recording ? '#fff' : 'rgba(255,255,255,.85)';
  ctx.lineWidth = recording ? 4 : 3;
  if (recording){ ctx.shadowColor = '#9fe8ff'; ctx.shadowBlur = 14; }
  ctx.beginPath();
  const amb = reduceMotion ? 2 : 6;
  const n = liveWave.length;
  let lp = 0; for (let i=0;i<n;i++) lp = Math.max(lp, Math.abs(liveWave[i]));
  const liveGain = 55 / Math.max(lp, 0.06);
  for (let x=0;x<=W;x+=6){
    let y = surfaceY + Math.sin(x*0.02 + time*0.002)*amb + Math.sin(x*0.007 - time*0.0013)*amb*0.7;
    if (recording && n){
      const idx = Math.floor(x/W * (n-1));
      y += liveWave[idx] * liveGain;     // 목소리 → 물결!
    }
    x ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
  }
  ctx.stroke();
  ctx.restore();
}

/* ============== 물고기 모양 읽기 ============== */
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function analyzeFish(f){
  const e = f.env, n = e.length;
  // 혹(마디) 세기: 소리가 컸다가 작아지는 덩어리 수
  let bumps = 0, inB = false, run = 0;
  for (let i=0;i<n;i++){
    if (!inB && e[i] > 0.4){ inB = true; run = 0; }
    if (inB){ run++; if (e[i] < 0.22){ inB = false; if (run >= 3) bumps++; } }
  }
  if (inB && run >= 3) bumps++;
  bumps = Math.max(1, bumps);
  let m = 0; for (const v of e) m += v; m /= n;
  const fat = m * (f.size / 106);                 // 0~1
  const level = fat >= 0.5 ? 3 : fat >= 0.28 ? 2 : 1;
  const tone = f.hue < 100 ? 'high' : f.hue > 170 ? 'low' : 'mid';
  return {bumps, level, tone, fat};
}
const KO_NUM = ['','한','두','세','네','다섯','여섯','일곱','여덟'];
function suggestNames(f){
  const a = analyzeFish(f);
  const list = [['날씬이','통통이','뚱뚱이'][a.level-1]];
  if (a.bumps >= 2) list.push((KO_NUM[a.bumps] || '여러') + '마디');
  list.push({high:'반짝이', mid:'살랑이', low:'둥실이'}[a.tone]);
  if (f.dur > 2.2) list.push('길쭉이');
  return [...new Set(list)].slice(0,4);
}

/* ============== 이름 짓기 ============== */
const nameModal = document.getElementById('nameModal');
const nTitle = document.getElementById('nTitle');

const nInput = document.getElementById('nInput');

const nPrev = document.getElementById('nPrev');
let nTarget = null, nMode = 'new', nSuggest = [];

function drawPreview(f){
  const pw = nPrev.clientWidth || 300, ph = nPrev.clientHeight || 120;
  nPrev.width = pw*DPR; nPrev.height = ph*DPR;
  const pctx = nPrev.getContext('2d');
  pctx.setTransform(DPR,0,0,DPR,0,0);
  const saved = ctx; ctx = pctx;
  const sc = Math.min(1.2, (pw-30)/(f.L + f.size*0.5), (ph-16)/(f.size*1.15));
  ctx.save(); ctx.translate(pw/2 + f.size*0.12*sc, ph/2); ctx.scale(sc, sc);
  drawFishShape(Object.assign({}, f, {x:0, y:0, dir:1}), 0);
  ctx.restore();
  ctx = saved;
}
function openNaming(f, mode){
  nTarget = f; nMode = mode; state = 'naming';
  nSuggest = suggestNames(f);
  if (mode === 'new'){
    nTitle.textContent = '새 물고기가 태어났어요!';
    nText.innerHTML = '내 목소리로 태어난 물고기에게<br><b>이름</b>을 지어 주세요';
    nInput.value = '';
    nSkip.textContent = '추천 이름 "' + nSuggest[0] + '"(으)로 할래요';
  } else {
    nTitle.textContent = '"' + f.name + '"';
    nText.innerHTML = '이름을 바꿔 줄까요?';
    nInput.value = f.name;
    nSkip.textContent = '그대로 둘래요';
  }
  nInput.placeholder = '예) ' + nSuggest[0];
  nChips.innerHTML = nSuggest.map(n => '<button class="chipBtn" data-n="' + esc(n) + '">' + esc(n) + '</button>').join('');
  nameModal.classList.add('open');
  requestAnimationFrame(() => { drawPreview(f); nInput.focus(); });
}
function closeNaming(name){
  const f = nTarget; if (!f) return;
  const mode = nMode;
  if (name) f.name = name.slice(0, 8);
  nameModal.classList.remove('open');
  nTarget = null; state = 'idle';
  save();
  if (mode === 'new'){
    hint('물고기를 누르면 이름을 바꿀 수 있어요. 또 만들려면 노란 버튼!');
    challenge = '';
    diverReact(f);
  } else if (name){
    toast('이제 이름은 <b>' + esc(f.name) + '</b>!');
  }
}
nChips.addEventListener('click', e => {
  const b = e.target.closest('.chipBtn'); if (!b) return;
  nInput.value = b.dataset.n; nInput.focus();
});
nOk.addEventListener('click', () => closeNaming(nInput.value.trim() || nSuggest[0]));
nSkip.addEventListener('click', () => closeNaming(nMode === 'new' ? nSuggest[0] : ''));
nInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) nOk.click(); });
nameModal.addEventListener('keydown', e => { if (e.key === 'Escape') nSkip.click(); });

/* 헤엄치는 물고기 위 이름표 */
function drawNameTag(f){
  if (!f.name) return;
  ctx.save();
  ctx.font = '800 13px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  const w = ctx.measureText(f.name).width + 16, h = 22;
  const x = f.x - w/2, y = f.y - f.size*0.62 - h - 4;
  ctx.fillStyle = 'rgba(255,255,255,.88)';
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, 11) : ctx.rect(x, y, w, h); ctx.fill();
  ctx.fillStyle = '#123a5c'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(f.name, f.x, y + h/2 + 1);
  ctx.restore();
}

function diverReact(f){

/* ============== 메인 루프 ============== */
let last = performance.now();
function frame(time){
  const dt = Math.min(0.05, (time-last)/1000); last = time;

  /* 녹음 중 오디오 분석 */
  if (state === 'recording' && analyser){
    analyser.getFloatTimeDomainData(timeData);
    analyser.getByteFrequencyData(freqData);
    let peak = 0, sq = 0;
    for (let i=0;i<timeData.length;i++){ const v = Math.abs(timeData[i]); if (v>peak) peak=v; sq += timeData[i]*timeData[i]; }
    const rms = Math.sqrt(sq/timeData.length);
    // 크기: 살짝만 다듬어 저장 (모양 유지)
    const env = envRec.length ? 0.65*peak + 0.35*lastPeak : peak;
    lastPeak = peak;
    envRec.push(env); rmsSum += rms; rmsN++;
    // 떨림: 파형이 0을 지나는 횟수(높은 소리일수록 많음) → 가장자리 물결 촘촘함
    let zc = 0, prev = 0; const th = peak*0.12;
    for (let i=0;i<timeData.length;i++){
      const v = timeData[i], sg = v > th ? 1 : (v < -th ? -1 : 0);
      if (sg){ if (prev && sg !== prev) zc++; prev = sg; }
    }
    const inc = rms > 0.01 ? Math.min(2.4, Math.max(0.35, zc*0.045)) : 0.2;
    if (rms > 0.02){ zcSum += zc * 48000/(audioCtx.sampleRate||48000); zcN++; }
    ripPhase += inc;
    ripRec.push(Math.sin(ripPhase));
    let mSum = 0, fSum = 0;
    for (let i=2;i<freqData.length;i++){ mSum += freqData[i]; fSum += freqData[i]*i; }
    if (mSum > 500 && rms > 0.015){ centroidSum += (fSum/mSum)/freqData.length; centroidW++; }
    // 수면용 라이브 파형 (다운샘플)
    const LN = 160;
    if (liveWave.length !== LN) liveWave = new Float32Array(LN);
    for (let i=0;i<LN;i++) liveWave[i] = timeData[Math.floor(i/LN*timeData.length)];
    // 진행 링 + 자동 종료
    const el = (time - recStart)/1000;
    ringC.style.strokeDashoffset = RING_LEN * (1 - el/MAX_REC);
    if (el >= MAX_REC) finishRecording();
  } else {
    liveWave = new Float32Array(0);
  }

  drawScene(time);

  /* 물고기 이동 + 그리기 */
  for (const f of fishes){
    if (f.state !== 'swim') continue;
    f.x += f.dir * f.speed * dt;
    const margin = f.L/2 + f.size*0.5;
    if (f.x > W + margin) f.x = -margin;
    if (f.x < -margin) f.x = W + margin;
    if (!f.baseY) f.baseY = f.y;
    f.y = f.baseY + (reduceMotion ? 0 : Math.sin(time*0.001*f.bobF + f.phase) * f.bobA);
    drawFishShape(f, time);
    drawNameTag(f);
  }

  if (state === 'recording') drawGrowingRibbon(time);
  if (state === 'morphing' && morph) drawMorph(time);

  requestAnimationFrame(frame);
}

/* ============== 마이크 허락 팝업 ============== */
const intro = document.getElementById('intro');
const startBtn = document.getElementById('startBtn');
const micErr = document.getElementById('micErr');
const modal = document.getElementById('micModal');
const mIcon = document.getElementById('mIcon');
const mTitle = document.getElementById('mTitle');
const mText = document.getElementById('mText');
const mGuide = document.getElementById('mGuide');
const mAllow = document.getElementById('mAllow');
const mClose = document.getElementById('mClose');
const arrowHint = document.getElementById('arrowHint');

const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const inFrame = (() => { try { return window.self !== window.top; } catch(e){ return true; } })();

function setModal({icon='', title, text, guide='', allow='마이크 허락하기', allowShow=true, close='나중에 할게요'}){
  mIcon.className = 'mIcon ' + icon;
  mTitle.innerHTML = title;
  mText.innerHTML = text;
  mGuide.innerHTML = guide;
  mGuide.classList.toggle('show', !!guide);
  mAllow.textContent = allow;
  mAllow.hidden = !allowShow;
  mClose.textContent = close;
}
function openModal(){ modal.classList.add('open'); setTimeout(()=> (mAllow.hidden ? mClose : mAllow).focus(), 50); }
function closeModal(){ modal.classList.remove('open'); arrowHint.classList.remove('show'); }

const GUIDE_DENIED = isMobile
  ? `<div class="who">선생님·어른이 도와주세요</div><ol>
      <li>주소창 옆 <b>자물쇠(또는 ⓘ)</b>를 눌러요</li>
      <li><b>권한 → 마이크</b>를 <b>허용</b>으로 바꿔요</li>
      <li>아래 <b>다시 해 보기</b>를 눌러요</li></ol>`
  : `<div class="who">선생님·어른이 도와주세요</div><ol>
      <li>주소창 왼쪽 <b>자물쇠(또는 설정) 아이콘</b>을 눌러요</li>
      <li><b>마이크</b>를 <b>허용</b>으로 바꿔요</li>
      <li>아래 <b>다시 해 보기</b>를 눌러요 (안 되면 새로고침)</li></ol>`;

function showAsk(){
  setModal({
    title:'마이크를 써도 될까요?',
    text:'물고기를 만들려면 <b>목소리</b>가 필요해요.<br>아래 버튼을 누르면 허락을 묻는 창이 떠요.'
  });
  openModal();
}
function showDenied(){
  setModal({icon:'bad', title:'마이크가 막혀 있어요',
    text:'괜찮아요! 마이크를 다시 켤 수 있어요.', guide:GUIDE_DENIED, allow:'다시 해 보기', close:'닫기'});
  openModal();
}
function showNoMic(){
  setModal({icon:'bad', title:'마이크를 찾을 수 없어요',
    text:'이 기기에 마이크가 연결되어 있는지 확인해 주세요.',
    guide:`<ol><li>헤드셋·마이크가 꽂혀 있는지 봐요</li><li>다른 앱이 마이크를 쓰고 있으면 꺼요</li><li><b>다시 해 보기</b>를 눌러요</li></ol>`,
    allow:'다시 해 보기', close:'닫기'});
  openModal();
}
function showBlockedPlace(){
  setModal({icon:'bad', title:'여기서는 마이크를 쓸 수 없어요',
    text:'이 화면은 마이크 허락 창을 띄울 수 없는 곳이에요.',
    guide:`<div class="who">선생님께</div><ol>
      <li>파일(index.html)을 <b>크롬 또는 엣지</b>로 직접 열거나</li>
      <li><b>https://</b> 주소의 홈페이지에 올려서 열어 주세요</li>
      <li>그러면 허락 창이 떠요!</li></ol>`,
    allowShow:false, close:'닫기'});
  openModal();
}

async function requestMic(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.isSecureContext){
    showBlockedPlace(); return;
  }
  setModal({icon:'wait', title:'허락 창을 확인해 주세요',
    text:(isMobile ? '화면에 뜬 창에서' : '화면 <b>위쪽</b>에 뜬 창에서') + '<br><b style="color:#e14e73">\'허용\'</b>을 눌러 주세요!',
    allowShow:false, close:'취소'});
  openModal();
  if (!isMobile) arrowHint.classList.add('show');
  try{
    await initMic();
    closeModal();
    startApp();
  }catch(err){
    arrowHint.classList.remove('show');
    const n = err && err.name;
    if (n === 'NotAllowedError' || n === 'SecurityError'){
      inFrame ? showBlockedPlace() : showDenied();
    } else if (n === 'NotFoundError' || n === 'OverconstrainedError'){
      showNoMic();
    } else if (n === 'NotReadableError'){
      showNoMic();
    } else {
      showBlockedPlace();
    }
  }
}

let started = false;
function startApp(){
  intro.style.display = 'none';
  if (!started){ started = true; load(); }
  diverEl.style.display = 'block';
  showTip(0);
}

mAllow.addEventListener('click', requestMic);
mClose.addEventListener('click', () => {
  closeModal();
  if (!micReady){
    startBtn.disabled = false;
    startBtn.textContent = '마이크 켜고 시작하기';
  }
});
modal.addEventListener('keydown', e => { if (e.key === 'Escape') mClose.click(); });

/* 시작 버튼: 이미 허락된 경우 바로, 아니면 팝업 */
startBtn.addEventListener('click', async () => {
  let st = 'prompt';
  try{
    if (navigator.permissions && navigator.permissions.query){
      st = (await navigator.permissions.query({name:'microphone'})).state;
    }
  }catch(e){}
  if (st === 'granted'){
    try{ await initMic(); startApp(); return; }catch(e){}
  }
  if (st === 'denied'){ showDenied(); return; }
  showAsk();
});

/* 녹음 버튼을 눌렀는데 마이크가 꺼져 있으면 팝업 */
recBtn.addEventListener('click', () => { if (!micReady) showAsk(); }, true);

requestAnimationFrame(frame);
